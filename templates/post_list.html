<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postlar roʻyxati</title>
    <!-- Premium Google Shrifti -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #090A0F; /* Chuqur premium to'q fon */
            background-image:
                radial-gradient(at 0% 0%, rgba(212, 175, 55, 0.04) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 255, 255, 0.02) 0px, transparent 50%);
            color: #E2E8F0;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
        }

        /* Sahifa sarlavhasi */
        .page-header {
            font-size: 1.6rem;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Postlar ro'yxati uchun konteyner */
        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Har bir post kartasi (Glassmorphism) */
        .post-card {
            background: rgba(18, 20, 29, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px 28px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow:
                0 20px 40px -15px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.08);
        }

        /* Sichqoncha kelganda kartaning jonlanishi */
        .post-card:hover {
            transform: translateY(-3px);
            border-color: rgba(212, 175, 55, 0.25);
            box-shadow:
                0 30px 60px -15px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px rgba(212, 175, 55, 0.2);
        }

        /* Post havolasi (Sarlavha) */
        .post-card a {
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 600;
            color: #FFFFFF;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: color 0.3s ease;
        }

        .post-card:hover a {
            color: #D4AF37; /* Oltin rang nuri */
        }

        /* O'ng tarafga kichik strelkacha (ikonka o'rnida) */
        .post-card a::after {
            content: '→';
            font-size: 1.1rem;
            color: #64748B;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .post-card:hover a::after {
            transform: translateX(4px);
            color: #D4AF37;
        }

        /* Postlar topilmagandagi holat uchun (agar  ishlatilsa) */
        .empty-posts {
            text-align: center;
            padding: 48px;
            color: #64748B;
            font-size: 0.95rem;
            background: rgba(18, 20, 29, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.08);
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="page-header">
        <span>Soʻnggi postlar</span>
    </div>

    <div class="posts-list">
        {% for post in posts %}
            <div class="post-card">
                <a href="{% url 'post_detail' post.id %}">
                    <span>{{ post.title }}</span>
                </a>
            </div>
        {% empty %}
            <div class="empty-posts">
                Hozircha postlar mavjud emas.
            </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
