<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimga kirish</title>
    <!-- Premium Google Shrifti -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* Asosiy nolga tushirish va shriftlar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090A0F; /* Chuqur premium to'q fon */
            background-image:
                radial-gradient(at 0% 0%, rgba(212, 175, 55, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 255, 255, 0.02) 0px, transparent 50%);
            color: #E2E8F0;
            overflow: hidden;
            position: relative;
        }

        /* Yupqa nurli bezak to'ri */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: blur(50px);
        }

        /* Forma konteyneri - Glassmorphism va Luxe Border */
        form {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 48px 40px;
            background: rgba(18, 20, 29, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow:
                0 30px 60px -12px rgba(0, 0, 0, 0.5),
                0 18px 36px -18px rgba(0, 0, 0, 0.7),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
        }

        form:hover {
            border-color: rgba(212, 175, 55, 0.2);
            box-shadow:
                0 40px 80px -15px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px rgba(212, 175, 55, 0.2);
        }

        /* sarlavha ko'rinishi (Django form.as_p ichida sarlavha bo'lmasa ham estetik kiritish) */
        form::before {
            content: 'Xush kelibsiz';
            display: block;
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            color: #FFFFFF;
            margin-bottom: 32px;
            text-align: center;
        }

        /* Django form {{ form.as_p }} teglari uslubi */
        form p {
            margin-bottom: 24px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Label (Maydon nomlari) */
        form p label {
            font-size: 0.825rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94A3B8;
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        /* Input (Kiritish maydonlari) */
        form p input[type="text"],
        form p input[type="password"],
        form p input[type="email"] {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 0.95rem;
            color: #F8FAFC;
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Input hover va focus holatlari */
        form p input:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }

        form p input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: #D4AF37; /* Hashamdor oltin rang nuri */
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.12);
        }

        /* Label rangini input focus bo'lganda o'zgartirish */
        form p:focus-within label {
            color: #D4AF37;
        }

        /* Django yordamchi yoki xatolik matnlari */
        form p .helptext,
        form p .errorlist {
            font-size: 0.75rem;
            color: #64748B;
            margin-top: 6px;
            list-style: none;
        }

        form p .errorlist {
            color: #F87171;
        }

        /* Premium Tugma (Button) */
        button[type="submit"] {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: linear-gradient(135deg, #E2C974 0%, #D4AF37 50%, #8A6D1C 100%);
            border: none;
            border-radius: 12px;
            color: #090A0F;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.3);
        }

        /* Tugma bosilganda va ustiga kelganda */
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(212, 175, 55, 0.4);
            filter: brightness(1.1);
        }

        button[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 5px 15px -3px rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
</form>

</body>
</html>
