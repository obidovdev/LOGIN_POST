<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruxsat etilmagan harakat</title>
    <!-- Premium Google Shrifti -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090A0F; /* Chuqur premium to'q fon */
            background-image:
                radial-gradient(at 0% 0%, rgba(220, 38, 38, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 255, 255, 0.02) 0px, transparent 50%);
            color: #E2E8F0;
            overflow: hidden;
            position: relative;
        }

        /* Orqa fondagi mayin qizg'ish/ogohlantiruvchi nur */
        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.12) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: blur(60px);
        }

        /* Ogohlantirish kartasi (Glassmorphism) */
        .error-card {
            position: relative;
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
            background: rgba(18, 20, 29, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow:
                0 30px 60px -12px rgba(0, 0, 0, 0.5),
                0 18px 36px -18px rgba(0, 0, 0, 0.7),
                inset 0 1px 1px rgba(255, 255, 255, 0.08);
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease;
        }

        .error-card:hover {
            border-color: rgba(220, 38, 38, 0.25);
        }

        /* Ikonka yoki kichik status elementi */
        .error-icon {
            width: 54px;
            height: 54px;
            margin: 0 auto 24px auto;
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F87171;
            font-size: 1.5rem;
        }

        /* Sarlavha */
        .error-card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        /* Asosiy matn */
        .error-card p {
            font-size: 0.925rem;
            line-height: 1.6;
            color: #94A3B8;
            margin-bottom: 32px;
        }

        /* Orqaga qaytish yoki bosh sahifa tugmasi */
        .btn-back {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #F8FAFC;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="error-icon">
        <!-- Qulf yoki ogohlantirish belgisi (SVG) -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
    </div>
    <h2>Ruxsat etilmadi</h2>
    <p>Sizda ushbu postni tahrirlash uchun huquq yoʻq, chunki siz uning muallifi emassiz.</p>

    <!-- Agar xohlasangiz orqaga qaytish havolasini qo'shishingiz mumkin -->
    <a href="javascript:history.back()" class="btn-back">Orqaga qaytish</a>
</div>

</body>
</html>
