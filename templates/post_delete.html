<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postni oʻchirishni tasdiqlash</title>
    <!-- Premium Google Shrifti -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090A0F; /* Chuqur premium to'q fon */
            background-image:
                radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 255, 255, 0.02) 0px, transparent 50%);
            color: #E2E8F0;
            overflow: hidden;
            position: relative;
        }

        /* Orqa fondagi ogohlantiruvchi mayin nur */
        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.1) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: blur(60px);
        }

        /* Tasdiqlash kartasi (Glassmorphism) */
        .delete-card {
            position: relative;
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
            background: rgba(18, 20, 29, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow:
                0 30px 60px -12px rgba(0, 0, 0, 0.5),
                0 18px 36px -18px rgba(0, 0, 0, 0.7),
                inset 0 1px 1px rgba(255, 255, 255, 0.08);
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease;
        }

        .delete-card:hover {
            border-color: rgba(239, 68, 68, 0.25);
        }

        /* O'chirish ikonkasi (Trash) */
        .delete-icon {
            width: 54px;
            height: 54px;
            margin: 0 auto 24px auto;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F87171;
        }

        /* Sarlavha / Savol matni */
        .delete-card p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #CBD5E1;
            margin-bottom: 32px;
        }

        /* Post nomini ajratib ko'rsatish uchun (ixtiyoriy dizayn uchun) */
        .delete-card p span {
            color: #FFFFFF;
            font-weight: 600;
        }

        /* Tugmalar guruhi */
        .actions {
            display: flex;
            gap: 12px;
        }

        /* Asosiy O'chirish tugmasi */
        button[type="submit"] {
            flex: 1;
            padding: 14px;
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            border: none;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.3);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(239, 68, 68, 0.4);
            filter: brightness(1.1);
        }

        /* Bekor qilish tugmasi */
        .btn-cancel {
            flex: 1;
            padding: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #F8FAFC;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="delete-card">
    <div class="delete-icon">
        <!-- Trash SVG ikonka -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
    </div>

    <p>Siz rostdan ham <span>«{{ post.title }}»</span> ni oʻchirib yubormoqchimisiz?</p>

    <form method="POST">
        {% csrf_token %}
        <div class="actions">
            <a href="javascript:history.back()" class="btn-cancel">Bekor qilish</a>
            <button type="submit">Oʻchirish</button>
        </div>
    </form>
</div>

</body>
</html>
