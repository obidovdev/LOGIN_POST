<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postni tahrirlash</title>
    <!-- Premium Google Shrifti -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090A0F; /* Chuqur premium to'q fon */
            background-image:
                radial-gradient(at 0% 0%, rgba(212, 175, 55, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 255, 255, 0.02) 0px, transparent 50%);
            color: #E2E8F0;
            padding: 40px 20px;
            position: relative;
        }

        /* Yupqa nurli bezak to'ri */
        body::before {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: blur(50px);
        }

        /* Forma konteyneri - Glassmorphism */
        form {
            position: relative;
            width: 100%;
            max-width: 520px;
            padding: 48px 40px;
            background: rgba(18, 20, 29, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow:
                0 30px 60px -12px rgba(0, 0, 0, 0.5),
                0 18px 36px -18px rgba(0, 0, 0, 0.7),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        form:hover {
            border-color: rgba(212, 175, 55, 0.2);
            box-shadow:
                0 40px 80px -15px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px rgba(212, 175, 55, 0.2);
        }

        /* Sahifa sarlavhasi */
        form::before {
            content: 'Postni tahrirlash';
            display: block;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #FFFFFF;
            margin-bottom: 32px;
            text-align: center;
        }

        /* Django form {{ form.as_p }} teglari uslubi */
        form p {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
        }

        /* Label (Maydon nomlari) */
        form p label {
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #94A3B8;
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        /* Input va Textarea maydonlari */
        form p input[type="text"],
        form p input[type="email"],
        form p textarea {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 0.95rem;
            color: #F8FAFC;
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Textarea uchun maxsus balandlik va moslashuvchanlik */
        form p textarea {
            min-height: 140px;
            resize: vertical;
            line-height: 1.6;
        }

        /* Hover va Focus holatlari */
        form p input:hover,
        form p textarea:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }

        form p input:focus,
        form p textarea:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: #D4AF37; /* Oltin rang nuri */
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.12);
        }

        /* Active label rangi */
        form p:focus-within label {
            color: #D4AF37;
        }

        /* Tugmalar guruhi */
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        /* O'zgarishlarni saqlash tugmasi */
        button[type="submit"] {
            flex: 2;
            padding: 16px;
            background: linear-gradient(135deg, #E2C974 0%, #D4AF37 50%, #8A6D1C 100%);
            border: none;
            border-radius: 12px;
            color: #090A0F;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.3);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(212, 175, 55, 0.4);
            filter: brightness(1.1);
        }

        /* Bekor qilish (Orqaga) tugmasi */
        .btn-cancel {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #F8FAFC;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="actions">
        <a href="javascript:history.back()" class="btn-cancel">Bekor qilish</a>
        <button type="submit">O'zgarishlarni saqlash</button>
    </div>
</form>

</body>
</html>
