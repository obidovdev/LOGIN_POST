<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post yangilandi</title>
    <!-- Premium Google Shrifti -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090A0F; /* Chuqur premium to'q fon */
            background-image:
                radial-gradient(at 0% 0%, rgba(212, 175, 55, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 255, 255, 0.02) 0px, transparent 50%);
            color: #E2E8F0;
            overflow: hidden;
            position: relative;
        }

        /* Orqa fondagi mayin oltin nur */
        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: blur(60px);
        }

        /* Muvaffaqiyat kartasi (Glassmorphism) */
        .success-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 48px 40px;
            background: rgba(18, 20, 29, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow:
                0 30px 60px -12px rgba(0, 0, 0, 0.5),
                0 18px 36px -18px rgba(0, 0, 0, 0.7),
                inset 0 1px 1px rgba(255, 255, 255, 0.08);
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease;
        }

        .success-card:hover {
            border-color: rgba(212, 175, 55, 0.25);
        }

        /* Muvaffaqiyat belgisi (Success Checkmark Icon) */
        .success-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 24px auto;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #D4AF37;
        }

        /* Sarlavha matni */
        .success-card h2 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        /* Izoh/Qo'shimcha matn */
        .success-card p {
            font-size: 0.925rem;
            color: #94A3B8;
            margin-bottom: 32px;
        }

        /* Postlarni ko'rish tugmasi */
        .btn-primary {
            display: inline-block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #E2C974 0%, #D4AF37 50%, #8A6D1C 100%);
            border: none;
            border-radius: 12px;
            color: #090A0F;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(212, 175, 55, 0.4);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

<div class="success-card">
    <div class="success-icon">
        <!-- Chipta / Tasdiqlash SVG belgisi -->
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
    </div>

    <h2>Post yangilandi</h2>
    <p>Oʻzgarishlar muvaffaqiyatli saqlandi.</p>

    <a href="{% url 'post_list' %}" class="btn-primary">Postlarni koʻrish</a>
</div>

</body>
</html>
